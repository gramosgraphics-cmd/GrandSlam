<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Admin · GrandSlam</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<style>
body{font:15px system-ui,sans-serif;background:#02189e;color:#fff;max-width:760px;margin:0 auto;padding:20px}
input,select,button{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid #fff5;background:#fff1;color:#fff}
select option{color:#000}button{background:#fecb02;color:#02189e;font-weight:700;cursor:pointer;border:0}
.g{display:grid;grid-template-columns:1fr 70px 70px 120px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #fff3}
.box{background:#0003;border:1px solid #fff3;border-radius:14px;padding:12px;margin:10px 0}.box b{color:#fecb02}#tx{width:100%;box-sizing:border-box;margin:8px 0}h2{margin:22px 0 6px;font-size:1.05rem}#msg{color:#fecb02;margin:10px 0}[hidden]{display:none}
</style></head><body>
<h1>Panel de administración</h1><p id="msg"></p>
<form id="login"><input id="em" type="email" placeholder="Correo" required> <input id="pw" type="password" placeholder="Contraseña" required> <button>Entrar</button></form>
<section id="app" hidden>
<h2>Jugada en vivo</h2>
<select id="gm"></select> <button id="rf">↻</button>
<div id="st" class="box">Elige un juego en vivo.</div>
<input id="tx" placeholder="Jugada: Gabriel Ramos pegó un hit · Situación: entrada 5 baja, 1 out, corredores en 1ra y 3ra, conteo 2-1" maxlength="300">
<button id="go">Interpretar</button> <button id="un">Deshacer última</button>
<div id="pv" class="box" hidden></div>
<h2>Marcadores (manual)</h2>
<select id="rd"></select><button id="out" style="margin-left:8px">Salir</button><div id="list"></div></section>
<script src="../config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
// La URL y la clave pública salen de ../config.js
const { url: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY } = window.GS_CONFIG || {};
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY), $ = s => document.querySelector(s);
const msg = t => $('#msg').textContent = t;
const names = ['Jornada 1','Jornada 2','Jornada 3','Jornada 4','Jornada 5','Jornada 6','Jornada 7','Jornada 8','Jornada 9','Jornada 10','Semifinal','Final'];
$('#rd').innerHTML = names.map((n, i) => `<option value="${i}">${n}</option>`).join('');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load() {
  const { data, error } = await sb.from('games').select('*, home:teams!games_home_id_fkey(abbr), away:teams!games_away_id_fkey(abbr)').eq('round_idx', +$('#rd').value).order('slot');
  if (error) return msg(error.message);
  $('#list').innerHTML = (data || []).map(g => `<div class="g" data-id="${g.id}"><b>${esc(g.away.abbr)} @ ${esc(g.home.abbr)}</b>
    <input type="number" min="0" value="${g.away_score}" data-f="away_score"><input type="number" min="0" value="${g.home_score}" data-f="home_score">
    <select data-f="status">${['prog','live','fin'].map(s => `<option ${s === g.status ? 'selected' : ''}>${s}</option>`).join('')}</select><button>Guardar</button></div>`).join('') || '<p>Sin juegos.</p>';
}
$('#list').onclick = async e => {
  if (e.target.tagName !== 'BUTTON') return;
  const row = e.target.closest('.g'), upd = {};
  row.querySelectorAll('[data-f]').forEach(i => upd[i.dataset.f] = i.type === 'number' ? +i.value : i.value);
  const { error } = await sb.from('games').update(upd).eq('id', row.dataset.id);
  msg(error ? error.message : 'Guardado ✔'); loadLive();
};
$('#rd').onchange = load;
$('#login').onsubmit = async e => { e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  if (error) return msg(error.message); show(true); };
$('#out').onclick = async () => { await sb.auth.signOut(); show(false); };

let pend = null;
const bases = v => ['1B','2B','3B'].map((b, i) => v.bases[i] ? `${b}: ${esc(v.bases[i])}` : null).filter(Boolean).join(' · ') || 'bases vacías';
const fmt = v => `${v.status === 'live' ? '' : '[' + v.status + '] '}${v.half === 'top' ? '▲' : '▼'} ${v.inning} · ${v.outs} outs · conteo ${v.balls}-${v.strikes} · ${bases(v)} · <b>Local ${v.home} - ${v.away} Visitante</b>`;
const call = async b => {
  const { data, error } = await sb.functions.invoke('play', { body: b });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  return data;
};
async function loadLive() {
  const { data } = await sb.from('games').select('id, status, round_idx, home:teams!games_home_id_fkey(abbr), away:teams!games_away_id_fkey(abbr)').in('status', ['live', 'prog']).order('status').order('round_idx').order('slot').limit(30);
  $('#gm').innerHTML = (data || []).map(g => `<option value="${g.id}">${esc(g.away.abbr)} @ ${esc(g.home.abbr)} (${names[g.round_idx]}) · ${g.status}</option>`).join('') || '<option value="">No hay juegos pendientes</option>';
  refresh();
}
async function refresh() {
  $('#pv').hidden = true; pend = null;
  if (!$('#gm').value) return $('#st').textContent = 'No hay juegos pendientes o en vivo.';
  try { $('#st').innerHTML = fmt((await call({ mode: 'state', game_id: +$('#gm').value })).view); } catch (e) { msg(e.message); }
}
$('#rf').onclick = loadLive; $('#gm').onchange = refresh;
$('#go').onclick = async () => {
  if (!$('#tx').value.trim() || !$('#gm').value) return;
  msg('Interpretando…'); $('#go').disabled = true;
  try {
    const r = await call({ mode: 'parse', game_id: +$('#gm').value, text: $('#tx').value });
    if (r.clarify) { msg(''); $('#pv').hidden = false; $('#pv').innerHTML = `❓ ${esc(r.clarify)}`; return; }
    pend = r; msg('');
    $('#pv').hidden = false;
    $('#pv').innerHTML = `<p>Entendí: <b>${esc(r.summary)}</b>${r.runs ? ` · anotan ${r.runs}` : ''}</p><p>Antes: ${fmt(r.before)}<br>Después: ${fmt(r.view)}</p><button id="ok">Confirmar y publicar</button> <button id="no">Cancelar</button>`;
    $('#ok').onclick = async () => {
      try { const a = await call({ mode: 'apply', game_id: +$('#gm').value, event: pend.event, summary: pend.summary, text: $('#tx').value });
        $('#tx').value = ''; $('#pv').hidden = true; $('#st').innerHTML = fmt(a.view); msg('Publicado ✔'); } catch (e) { msg(e.message); }
    };
    $('#no').onclick = () => { $('#pv').hidden = true; pend = null; };
  } catch (e) { msg(e.message); } finally { $('#go').disabled = false; }
};
$('#un').onclick = async () => {
  if (!$('#gm').value || !confirm('¿Deshacer la última jugada?')) return;
  try { const r = await call({ mode: 'undo', game_id: +$('#gm').value }); $('#st').innerHTML = fmt(r.view); msg('Deshecho: ' + (r.undone || '')); } catch (e) { msg(e.message); }
};
function show(on) { $('#login').hidden = on; $('#app').hidden = !on; msg(''); if (on) { load(); loadLive(); } }
sb.auth.getSession().then(({ data }) => show(!!data.session));
</script></body></html>
